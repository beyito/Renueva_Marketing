<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - ReNueva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display:flex; min-height:100vh;">
        <aside style="width:250px; background:#2c3e50; color:white; padding:20px;">
            <h2>Admin</h2>
            <ul><li style="padding:10px 0; border-bottom:1px solid #444;">📦 Gestión Prendas</li></ul>
            <a href="index.html" style="color:#aaa; margin-top:20px; display:block;">Salir</a>
        </aside>
        <main style="flex:1; padding:30px;">
            <h1>Control de Calidad</h1>
            <table style="width:100%; background:white; border-collapse:collapse; margin-top:20px;">
                <tr style="background:#eee;"><th style="padding:15px;">Prenda</th><th style="padding:15px;">Estado</th><th style="padding:15px;">Acción</th></tr>
                <tr>
                    <td style="padding:15px; border-bottom:1px solid #eee;">Camisa Lino (Lote #01)</td>
                    <td style="padding:15px; border-bottom:1px solid #eee;">Falta Botón</td>
                    <td style="padding:15px; border-bottom:1px solid #eee;">
                        <button style="background:#27ae60; color:white; border:none; padding:5px 10px; border-radius:4px;">Aprobar</button>
                    </td>
                </tr>
            </table>
        </main>
    </div>
</body>
</html>
