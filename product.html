<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle - ReNueva</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Re<span>Nuev</span>a</div>
            <a href="cart.html" class="cart-icon-container">🛒 <span id="cart-count" class="cart-badge">0</span></a>
        </nav>
    </header>
    <div class="detail-container" style="display:grid; grid-template-columns:1fr 1fr; gap:40px; max-width:1000px; margin:40px auto; padding:20px;">
        <div id="detail-img" class="detail-image" style="height:400px; background-color:#eee; border-radius:10px; background-size:cover;"></div>
        <div class="detail-info">
            <span id="detail-category" style="color:#666; font-size:0.9rem; text-transform:uppercase;">Categoría</span>
            <h1 id="detail-name" style="font-size:2.5rem; color:var(--primary);">Cargando...</h1>
            <span id="detail-price" style="font-size:2rem; color:var(--accent); font-weight:bold;">-- Bs.</span>
            <div style="background:#f8f9fa; padding:20px; border-left:4px solid var(--accent); margin:20px 0;">
                <p><strong>Estado:</strong> <span id="detail-condition">...</span></p>
                <p><strong>Mantenimiento:</strong> <span id="detail-repairs">...</span></p>
            </div>
            <button id="detail-add-btn" class="btn-submit">AÑADIR AL CARRITO</button>
            <a href="index.html" style="display:block; margin-top:20px; text-decoration:underline;">← Volver al catálogo</a>
        </div>
    </div>
</body>
</html>
