<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - ReNueva</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Re<span>Nuev</span>a</div>
            <a href="index.html">← Seguir Comprando</a>
        </nav>
    </header>

    <div class="cart-page-container">
        <div class="cart-content">
            <h2>Tu Carrito</h2>
            <div id="cart-items-container"></div>
        </div>
        <div class="cart-summary" style="background:white; padding:25px; border-radius:12px; height:fit-content;">
            <h3>Resumen</h3>
            <div style="display:flex; justify-content:space-between;"><span>Subtotal</span><span id="subtotal">0 Bs.</span></div>
            <div style="display:flex; justify-content:space-between;"><span>Envío</span><span>15 Bs.</span></div>
            <hr>
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem;"><span>TOTAL</span><span id="cart-total">0 Bs.</span></div>
            <button class="btn-submit" onclick="window.location.href='checkout.html'">FINALIZAR COMPRA</button>
        </div>
    </div>
</body>
</html>
