<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Renueva</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <style>
        .main-login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 40px 20px;
        }
        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 20px;
            text-align: left;
        }
        .terms-check input {
            width: auto; /* Reset del ancho 100% global */
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Re<span>Nuev</span>a</div>
            <div class="nav-links">
                <a href="index.html">Volver al Inicio</a>
                <a href="login.html" class="btn-cta">Ya tengo cuenta</a>
            </div>
        </nav>
    </header>

    <div class="main-login-wrapper">
        <div class="login-container" style="max-width: 500px;">
            <div class="logo" style="margin-bottom: 5px;">Re<span>Nuev</span>a</div>
            <p class="brand-tagline">Crea tu cuenta para comprar y vender moda circular.</p>
            
            <form onsubmit="event.preventDefault(); handleRegister();">
                
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="reg-name" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="input-group">
                    <label>WhatsApp / Celular</label>
                    <input type="tel" id="reg-phone" placeholder="Ej. 70012345" required>
                </div>

                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="reg-pass" placeholder="Mín 6 caracteres" required minlength="6">
                    </div>
                    <div class="input-group">
                        <label>Confirmar</label>
                        <input type="password" id="reg-confirm" placeholder="Repetir" required>
                    </div>
                </div>

                <div class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        Acepto los <a href="#" style="color:var(--accent); text-decoration:underline;">Términos y Condiciones</a> y la Política de Privacidad de Renueva.
                    </label>
                </div>

                <button type="submit" class="btn-login">CREAR CUENTA</button>
            </form>

            <div class="divider" style="margin: 20px 0; display:flex; align-items:center; color:#ccc;">
                <span style="flex:1; border-bottom:1px solid #eee;"></span>
                <span style="padding:0 10px; font-size:0.8rem;">O regístrate con</span>
                <span style="flex:1; border-bottom:1px solid #eee;"></span>
            </div>

            <div style="display: flex; gap: 10px;">
                <button style="flex: 1; padding: 10px; background: white; border: 1px solid #ddd; border-radius: 5px; cursor: pointer;">Google</button>
                <button style="flex: 1; padding: 10px; background: #3b5998; color: white; border: none; border-radius: 5px; cursor: pointer;">Facebook</button>
            </div>
        </div>
    </div>

    <script>
        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-confirm').value;

            // 1. Validar que las contraseñas coincidan
            if (pass !== confirm) {
                // Usamos el showToast de script.js si está cargado, si no, alert
                if(typeof showToast === "function") {
                    showToast('Las contraseñas no coinciden', 'error');
                } else {
                    alert('Las contraseñas no coinciden');
                }
                return;
            }

            // 2. Crear objeto de usuario
            const newUser = {
                name: name,
                email: email,
                phone: phone
            };

            // 3. Guardar en LocalStorage (Simulando base de datos)
            localStorage.setItem('currentUser', JSON.stringify(newUser));

            // 4. Feedback y Redirección
            if(typeof showToast === "function") showToast('¡Cuenta creada con éxito!');
            
            setTimeout(() => {
                window.location.href = 'index.html'; // Te lleva al inicio ya logueado
            }, 1500);
        }
    </script>
</body>
</html>
