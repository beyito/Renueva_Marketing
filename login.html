<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Renueva</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <style>
        /* Ajuste específico para centrar el login sin romper el header */
        .main-login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh; /* Altura menos el header */
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Re<span>Nuev</span>a</div>
            <div class="nav-links">
                <a href="cart.html" class="cart-icon-container">🛒 <span id="cart-count" class="cart-badge">0</span></a>
                <a href="index.html#catalogo">Comprar</a>
                <a href="agendar-recojo.html">Vender</a>
                <a href="login.html" id="nav-login" class="btn-cta">Ingresar</a>
                <div id="nav-user-menu" style="display:none; align-items:center; gap:10px;">
                    <a href="dashboard.html" style="font-weight:bold; color:var(--primary); display:flex; align-items:center;">
                        <div style="width:30px; height:30px; background:var(--accent); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-right:5px; font-size:0.8rem;">👤</div>
                        Hola, <span id="nav-username" style="margin-left:4px;">Usuario</span>
                    </a>
                    <a href="#" onclick="logout()" style="font-size:0.85rem; color:#888; text-decoration:underline;">(Salir)</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-login-wrapper">
        <div class="login-container">
            <div class="logo" style="margin-bottom: 10px;">Re<span>Nuev</span>a</div>
            <p class="brand-tagline">Bienvenido de nuevo a la moda circular.</p>

            <form onsubmit="event.preventDefault(); handleLoginSubmit();">
                
                <div class="input-group">
                    <label for="email" style="text-align: left; display: block; margin-bottom: 5px; font-weight: 500;">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password" style="text-align: left; display: block; margin-bottom: 5px; font-weight: 500;">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div style="text-align: right; margin-bottom: 20px; font-size: 0.85rem;">
                    <a href="#" style="color:#666;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">INGRESAR</button>
            </form>

            <div style="display: flex; align-items: center; margin: 20px 0; color: #888; font-size: 0.85rem;">
                <div style="flex: 1; border-bottom: 1px solid #ddd;"></div>
                <span style="padding: 0 10px;">O ingresa con</span>
                <div style="flex: 1; border-bottom: 1px solid #ddd;"></div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button style="flex: 1; padding: 10px; background: white; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <span style="margin-right: 8px;">G</span> Google
                </button>
                <button style="flex: 1; padding: 10px; background: #3b5998; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    Facebook
                </button>
            </div>

            <p style="margin-top:15px; font-size:0.9rem;">
                ¿No tienes cuenta? <a href="registro.html" style="color:var(--accent); font-weight: bold;">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        function handleLoginSubmit() {
            const email = document.getElementById('email').value;
            // Usamos la parte antes del @ como "Nombre" para el prototipo
            const name = email.split('@')[0]; 
            // Llamamos a la función principal que está en script.js
            loginUser(name, email);
        }
    </script>
</body>
</html>
