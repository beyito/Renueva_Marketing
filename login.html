<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Renueva</title>
    <style>
        /* --- ESTILOS CSS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Cambiado a min-height para evitar cortes en pantallas pequeñas */
        }

        .login-container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .brand-tagline {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            transition: border-color 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2e7d32;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 1.5rem;
        }

        .btn-login:hover {
            background-color: #1b5e20;
        }

        /* --- NUEVOS ESTILOS PARA SOCIAL LOGIN --- */
        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            color: #888;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-social {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            border: 1px solid transparent;
            text-decoration: none; /* En caso de usar <a> */
        }

        /* Estilo Google */
        .btn-google {
            background-color: white;
            border: 1px solid #ddd;
            color: #333;
        }
        .btn-google:hover {
            background-color: #f9f9f9;
            border-color: #ccc;
        }

        /* Estilo Facebook */
        .btn-facebook {
            background-color: #1877f2;
            color: white;
        }
        .btn-facebook:hover {
            background-color: #1565c0;
        }

        .btn-social svg {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .footer-links {
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #2e7d32;
            text-decoration: none;
            margin: 0 5px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-logo">Renueva ♻️</div>
        <p class="brand-tagline">Moda de calidad con una segunda vida</p>

        <form action="#">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <div class="divider">
            <span>O continúa con</span>
        </div>

        <div class="social-buttons">
            
            <button class="btn-social btn-google">
                <svg viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
                Google
            </button>

            <button class="btn-social btn-facebook">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15h-2.4v-3H10V9.86c0-2.3 1.34-3.66 3.48-3.66 1.02 0 2.09.18 2.09.18v2.3h-1.18c-1.14 0-1.5.7-1.5 1.44V12h2.58l-.42 3h-2.16v6.8c4.56-.93 8-4.96 8-9.8z" />
                </svg>
                Facebook
            </button>
        </div>

        <div class="footer-links">
            <a href="#">¿Olvidaste tu contraseña?</a> | <a href="#">Crear cuenta</a>
        </div>
    </div>

</body>
</html>
